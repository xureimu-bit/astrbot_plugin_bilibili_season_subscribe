name: astrbot_plugin_bilibili_season_subscribe
display_name: B站合集订阅
short_desc: 从合集、视频链接或 QQ 分享卡片订阅系列，自动追更、补漏与 AI 总结。
desc: 支持视频链接、BV／AV 和引用 QQ 分享卡片订阅系列，优先接上合集，没有合集时按 UP、节目及版本追更。支持独立规则、投稿补漏、失败重试、字幕／语音转写总结与 AI 聊天调用。
help: |-
  指令：
  /bili合集订阅 添加 <合集/视频链接|BV|AV>（可引用视频卡片）
  /bili合集订阅 删除 <订阅ID>
  /bili合集订阅 列表
  /bili合集订阅 检查
  /bili合集订阅 重试 [season_id|全部]
  /bili合集订阅 总结 <BV号|视频链接>
  /bili合集订阅 规则 <订阅ID>
  /bili合集订阅 排除/恢复/补发 <订阅ID> <BV|AV|视频链接>
version: 1.9.0
author: xureimu-bit
repo: https://github.com/xureimu-bit/astrbot_plugin_bilibili_season_subscribe
category: integrations
tags:
  - bilibili
  - 合集订阅
  - 视频推送
  - AI总结
  - 语音转写
astrbot_version: ">=4.5.7"
